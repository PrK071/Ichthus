<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ichthus</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">♪</span>
          <h1>Ichthus</h1>
        </div>
        <div class="header-actions">
          <button id="languageBtn" class="ghost-button small-button" type="button">EN</button>
        </div>
      </header>

      <section class="listen-panel">
        <div class="status-row">
          <div id="bars" class="bars" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span><span></span><span></span>
            <span></span><span></span><span></span>
          </div>
          <span id="statusText" class="status-text"></span>
        </div>

        <button id="recognizeBtn" class="accent-button primary-button" type="button" aria-label="Ouvir Musica" title="Ouvir Musica">
          <svg class="button-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 2.75a3.25 3.25 0 0 0-3.25 3.25v5.5a3.25 3.25 0 0 0 6.5 0v-5.5A3.25 3.25 0 0 0 12 2.75Z"></path>
            <path d="M18.5 10.5v1a6.5 6.5 0 0 1-13 0v-1"></path>
            <path d="M12 18v3.25"></path>
            <path d="M8.5 21.25h7"></path>
          </svg>
          <span class="sr-only">Ouvir Musica</span>
        </button>
        <button id="stopBtn" class="muted-button primary-button" type="button" aria-label="Pausar gravacao" title="Pausar gravacao" disabled>
          <svg class="button-icon pause-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M7.5 5.25h3.25v13.5H7.5Z"></path>
            <path d="M13.25 5.25h3.25v13.5h-3.25Z"></path>
          </svg>
          <span class="sr-only">Pausar gravacao</span>
        </button>
      </section>

      <section aria-labelledby="resultLabel" class="section-block">
        <p id="resultLabel" class="section-label">Resultado</p>
        <article id="resultCard" class="result-card hidden">
          <div id="coverBox" class="cover-box">
            <span>♪</span>
          </div>
          <div class="result-info">
            <h2 id="songTitle">-</h2>
            <p id="songArtist">-</p>
            <div id="platformLinks" class="platform-links hidden">
              <button id="youtubeBtn" class="platform-button" type="button" title="Abrir no YouTube">
                <img src="assets/youtube.svg" alt="YouTube">
              </button>
              <button id="spotifyBtn" class="platform-button" type="button" title="Abrir no Spotify">
                <img src="assets/spotify.svg" alt="Spotify">
              </button>
            </div>
          </div>
        </article>
      </section>

      <div class="action-grid">
        <button id="historyToggleBtn" class="ghost-button" type="button">Histórico</button>
        <button id="clearResultBtn" class="muted-button" type="button">Limpar resultado</button>
      </div>

      <section id="historyPanel" class="history-panel hidden" aria-labelledby="historyTitle">
        <div class="history-head">
          <div>
            <h2 id="historyTitle">Histórico</h2>
            <p id="historyCount">0 músicas salvas</p>
          </div>
          <button id="clearHistoryBtn" class="muted-button compact-button" type="button">Limpar histórico</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <script src="vendor/vibra/vibra.js"></script>
    <script src="vibra-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
