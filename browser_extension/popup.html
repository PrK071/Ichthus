<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ichthus</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">♪</span>
          <h1>Ichthus</h1>
        </div>
        <div class="header-actions">
          <button id="languageBtn" class="ghost-button small-button" type="button">EN</button>
        </div>
      </header>

      <section class="status-row">
        <div id="bars" class="bars" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <span id="statusText">Pronto para ouvir</span>
      </section>

      <button id="recognizeBtn" class="accent-button primary-button" type="button">Ouvir Música</button>
      <button id="stopBtn" class="muted-button primary-button" type="button" disabled>Parar gravação</button>

      <section aria-labelledby="resultLabel" class="section-block">
        <p id="resultLabel" class="section-label">Resultado</p>
        <article id="resultCard" class="result-card hidden">
          <div id="coverBox" class="cover-box">
            <span>♪</span>
          </div>
          <div class="result-info">
            <h2 id="songTitle">-</h2>
            <p id="songArtist">-</p>
            <div id="platformLinks" class="platform-links hidden">
              <button id="youtubeBtn" class="platform-button" type="button" title="Abrir no YouTube">
                <img src="assets/youtube.svg" alt="YouTube">
              </button>
              <button id="spotifyBtn" class="platform-button" type="button" title="Abrir no Spotify">
                <img src="assets/spotify.svg" alt="Spotify">
              </button>
            </div>
          </div>
        </article>
      </section>

      <div class="action-grid">
        <button id="historyToggleBtn" class="ghost-button" type="button">Histórico</button>
        <button id="clearResultBtn" class="muted-button" type="button">Limpar resultado</button>
      </div>

      <section id="historyPanel" class="history-panel hidden" aria-labelledby="historyTitle">
        <div class="history-head">
          <div>
            <h2 id="historyTitle">Histórico</h2>
            <p id="historyCount">0 músicas salvas</p>
          </div>
          <button id="clearHistoryBtn" class="muted-button compact-button" type="button">Limpar histórico</button>
        </div>
        <div id="historyList" class="history-list"></div>
      </section>
    </main>

    <script src="vendor/vibra/vibra.js"></script>
    <script src="vibra-client.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
